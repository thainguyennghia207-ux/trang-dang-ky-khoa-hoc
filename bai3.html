<!DOCTYPE html>
<html>
<head>
    <title>TRANG ĐĂNG KÝ KHÓA HỌC</title>
</head>
<body>
    <h1>TRANG ĐĂNG KÝ KHÓA HỌC LẬP TRÌNH</h1>
    <br><br>
    <form>
        <label>Họ và tên:</label>
        <input type="text">
        <br><br>
        <label>Email:</label>
        <input type="email">
        <br><br>
        <label>Mật Khẩu:</label>
        <input type="password">
        <br><br>
        <label>Ngày Sinh:</label>
        <input type="date">
        <br><br>
        <label>Tuổi:</label>
        <input type="number">
        <br><br>
        <label>Giới Tính:</label>
        <input type="radio" name="gioi_tinh" value="Nam">Nam
        <input type="radio" name="gioi_tinh" value="Nữ">Nữ
        <br><br>
        <label>Khóa Học:</label>
        <input type="radio" name="mon_hoc" value="HTML">HTML
        <input type="radio" name="mon_hoc" value="CSS">CSS
        <input type="radio" name="mon_hoc" value="JavaScript">JavaScript
        <input type="radio" name="mon_hoc" value="C#">C#
        <input type="radio" name="mon_hoc" value="ASP.NET">ASP.NET
        <br><br>
        <label>Sở Thích:</label>
        <input type="checkbox" name="so_thich" value="Đọc sách">Đọc sách
        <input type="checkbox" name="so_thich" value="Xem phim">Xem phim
        <input type="checkbox" name="so_thich" value="Nghe nhạc">Nghe nhạc
        <input type="checkbox" name="so_thich" value="Đá bóng">Đá bóng
        <br><br>
        <button>Đăng Ký</button>
        <button>Làm lại</button>
    </form>
</body>
</html>
